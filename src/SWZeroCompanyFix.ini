; Star Wars Zero Company save fix - settings. 1 = on, 0 = off. Restart the game after a change.

[General]
; Write SWZeroCompanyFix.log next to this file (this session; the one before is kept as .previous.log).
LogFile=1

[Fixes]
; Release abilities whose animation never reported that it finished (reportedly the
; concussion grenade). While such an ability is stuck, the game refuses every save and
; every autosave for the rest of the mission.
StuckAbilitySaveFix=1

; How long an ability may stay "presenting" before it counts as stuck, in seconds (5-3600).
; Normal ability animations finish in a few seconds.
StuckAbilityTimeoutSeconds=30

; Log each save blocker (combat turn, cinematic, menu, ability...) when it starts or stops
; blocking saves, with the game's own reason. Useful if saving is still refused.
LogSaveBlockers=1
